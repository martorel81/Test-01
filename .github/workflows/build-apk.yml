name: Build Gestionale Bar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Estrai progetto
        run: |
          mkdir android-project
          unzip -q Gestionale_Bar_ANDROID_TEST_v3.zip -d android-project
          PROJECT=$(find android-project -name settings.gradle -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
  run: |
    cd "$PROJECT_DIR"
    echo "android.useAndroidX=true" >> gradle.properties
    echo "android.enableJetifier=true" >> gradle.properties
    gradle assembleDebug

      - name: Prepara APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" Gestionale_Bar_TEST.apk

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestionale_Bar_TEST_APK
          path: Gestionale_Bar_TEST.apk
