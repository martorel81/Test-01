name: Build Gestionale Bar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Estrai progetto Android
        shell: bash
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -q Gestionale_Bar_ANDROID_TEST_v3.zip -d android-project
          SETTINGS_FILE="$(find android-project -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRORE: settings.gradle non trovato nello ZIP"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Progetto Android: $PROJECT_DIR"
          test -f "$PROJECT_DIR/gradle.properties" || touch "$PROJECT_DIR/gradle.properties"
          grep -q '^android.useAndroidX=true$' "$PROJECT_DIR/gradle.properties" || echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"
          grep -q '^android.enableJetifier=true$' "$PROJECT_DIR/gradle.properties" || echo 'android.enableJetifier=true' >> "$PROJECT_DIR/gradle.properties"

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verifica SDK Android 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager non trovato: uso i componenti Android preinstallati sul runner"
          fi

      - name: Compila APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Prepara APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" Gestionale_Bar_TEST.apk

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: Gestionale_Bar_TEST_APK
          path: Gestionale_Bar_TEST.apk
          if-no-files-found: error
