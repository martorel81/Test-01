name: Build Gestionale Bar RELEASE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Estrai progetto Android
        shell: bash
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -q Gestionale_Bar_ANDROID_TEST_v3.zip -d android-project
          SETTINGS_FILE="$(find android-project -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRORE: settings.gradle non trovato nello ZIP"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/gradle.properties" || touch "$PROJECT_DIR/gradle.properties"
          grep -q '^android.useAndroidX=true$' "$PROJECT_DIR/gradle.properties" || echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"
          grep -q '^android.enableJetifier=true$' "$PROJECT_DIR/gradle.properties" || echo 'android.enableJetifier=true' >> "$PROJECT_DIR/gradle.properties"

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verifica SDK Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Compila RELEASE non firmata
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" assembleRelease --stacktrace

      - name: Firma APK RELEASE
        shell: bash
        run: |
          UNSIGNED="$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"

          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"

          keytool -genkeypair -v \
            -keystore gestionale-test-release.jks \
            -storepass GestionaleBarTest2026 \
            -keypass GestionaleBarTest2026 \
            -alias gestionale-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Gestionale Bar TEST,O=Gestionale Bar,C=IT"

          "$BT/zipalign" -p -f 4 "$UNSIGNED" Gestionale_Bar_TEST_RELEASE_aligned.apk

          "$BT/apksigner" sign \
            --ks gestionale-test-release.jks \
            --ks-pass pass:GestionaleBarTest2026 \
            --key-pass pass:GestionaleBarTest2026 \
            --out Gestionale_Bar_TEST_RELEASE.apk \
            Gestionale_Bar_TEST_RELEASE_aligned.apk

          "$BT/apksigner" verify --verbose Gestionale_Bar_TEST_RELEASE.apk

      - name: Salva APK RELEASE
        uses: actions/upload-artifact@v4
        with:
          name: Gestionale_Bar_TEST_RELEASE_APK
          path: Gestionale_Bar_TEST_RELEASE.apk
          if-no-files-found: error
